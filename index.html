<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중학교 역사 사료 탐정단 - 사료 분석 & 검증기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <h1>🔍 역사 사료 탐정단</h1>
      <p>사료를 비판적으로 읽고, 비어 있는 역사의 조각을 맞춰봅시다!</p>
    </div>
  </header>

  <main class="main-container">
    <!-- 왼쪽: 사료 선택 및 입력 영역 -->
    <section class="panel input-panel">
      <h2>1. 사료 준비하기</h2>
      
      <div class="form-group">
        <label for="sample-select">📌 수업용 샘플 사료 선택</label>
        <select id="sample-select">
          <option value="">-- 직접 입력하기 --</option>
          <option value="samguk">삼국사기: 온조왕 이야기 (삼국 시대)</option>
          <option value="musin">무신정변 당시의 정변 명분 (고려 시대)</option>
          <option value="manjeok">만적의 난 노비 해방 서원 (고려 시대)</option>
          <option value="joseon">조선책략 중 일부분 (근대 개항기)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="source-title">사료 제목</label>
        <input type="text" id="source-title" placeholder="예: 만적의 난 발통문">
      </div>

      <div class="form-group">
        <label for="source-text">사료 원문 / 번역문</label>
        <textarea id="source-text" rows="8" placeholder="분석할 사료 내용을 입력하거나 위 샘플을 선택하세요."></textarea>
      </div>
    </section>

    <!-- 오른쪽: 사료 분석 및 검증 워크시트 -->
    <section class="panel analysis-panel">
      <h2>2. 3단계 사료 비판 & 분석표</h2>

      <form id="analysis-form">
        <!-- Step 1: 출처 및 성격 -->
        <fieldset class="step-box">
          <legend>Step 1. 출처 및 성격 파악</legend>
          
          <div class="form-group">
            <label for="author">✍️ 작성자 (누가 썼는가?)</label>
            <input type="text" id="author" placeholder="예: 김부식 / 노비 만적 등">
          </div>

          <div class="form-group">
            <label for="period">📅 작성 시기 / 시대 배경</label>
            <input type="text" id="period" placeholder="예: 고려 의종 때 / 1198년">
          </div>

          <div class="form-group">
            <label for="type">🏷️ 사료의 종류</label>
            <select id="type">
              <option value="공식 기록 (정사, 실록 등)">공식 기록 (정사, 실록, 승정원일기 등)</option>
              <option value="개인 기록 (일기, 편지, 문집 등)">개인 기록 (일기, 편지, 문집 등)</option>
              <option value="선언문 / 격문 / 대중 문서">선언문 / 격문 / 대중 문서</option>
              <option value="외교 문서 / 조약서">외교 문서 / 조약서</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </fieldset>

        <!-- Step 2: 비판적 검증 -->
        <fieldset class="step-box">
          <legend>Step 2. 비판적 검증 (신뢰성 평가)</legend>

          <div class="form-group">
            <label for="purpose">🎯 작성 목적 (왜 만들었을까?)</label>
            <textarea id="purpose" rows="2" placeholder="작성자가 이 글을 통해 전달하고자 한 진짜 의도는 무엇인가요?"></textarea>
          </div>

          <div class="form-group">
            <label for="bias">⚖️ 주관적 입장이나 편향성 검토</label>
            <textarea id="bias" rows="2" placeholder="작성자의 신분, 정치적 입장이 반영되어 과장되거나 숨겨진 내용이 있나요?"></textarea>
          </div>

          <div class="form-group">
            <label>⭐ 학생 종합 신뢰도 평가</label>
            <div class="rating-options">
              <label><input type="radio" name="reliability" value="매우 높은 신뢰성" checked> 매우 높음</label>
              <label><input type="radio" name="reliability" value="보통 (편향성 고려 필요)"> 보통 (비판적 읽기 필요)</label>
              <label><input type="radio" name="reliability" value="낮음 (주관적/선전용)"> 낮음 (주관적 입장에 치우침)</label>
            </div>
          </div>
        </fieldset>

        <!-- Step 3: 역사적 의미 -->
        <fieldset class="step-box">
          <legend>Step 3. 역사적 의미 도출</legend>

          <div class="form-group">
            <label for="conclusion">💡 이 사료가 말해주는 당시의 역사적 사실</label>
            <textarea id="conclusion" rows="3" placeholder="이 사료를 통해 알 수 있는 당시 사회의 특징이나 역사적 사건의 의미를 정리해보세요."></textarea>
          </div>
        </fieldset>

        <button type="button" id="btn-analyze" class="btn-primary">📊 분석 결과 리포트 생성</button>
      </form>
    </section>
  </main>

  <!-- 분석 결과 출력 모달 / 하단 결과창 -->
  <section id="report-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>📜 사료 분석 검증 리포트</h2>
      <div id="report-output"></div>
      <div class="modal-actions">
        <button id="btn-print" class="btn-secondary">🖨️ 인쇄 / PDF 저장</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
